<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>TGDrive Admin</title>
<style>
:root{color-scheme:light dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--sidebar:168px;--border:color-mix(in srgb,CanvasText 16%,transparent);--muted:color-mix(in srgb,CanvasText 60%,transparent);--surface:color-mix(in srgb,Canvas 94%,CanvasText 6%);--surface2:color-mix(in srgb,Canvas 90%,CanvasText 10%)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:Canvas;color:CanvasText}button,input,select{font:inherit}button{min-height:34px;padding:0 10px;border:1px solid var(--border);border-radius:7px;background:ButtonFace;color:ButtonText;cursor:pointer}button:hover:not(:disabled){background:var(--surface2)}button:disabled{opacity:.55;cursor:not-allowed}input,select{min-height:36px;padding:0 9px;border:1px solid var(--border);border-radius:7px;background:Canvas;color:CanvasText}
#layout{display:flex;min-height:100vh}#menu{width:var(--sidebar);flex:0 0 var(--sidebar);padding:14px 9px;border-right:1px solid var(--border);background:var(--surface);position:sticky;top:0;height:100vh;overflow:auto}.menu-brand{padding:4px 8px 14px;border-bottom:1px solid var(--border);margin-bottom:8px;font-size:18px;font-weight:700}.menu-item,.menu-group-header,.menu-child,.menu-collapse-all{width:100%;display:flex;align-items:center;text-align:left;border:0;background:transparent;border-radius:7px}.menu-item,.menu-group-header{min-height:38px;font-size:14px;font-weight:700}.menu-item{padding:0 9px}.menu-group{margin:5px 0}.menu-group-header{justify-content:space-between;padding:0 9px;color:CanvasText}.menu-group-header:hover,.menu-item:hover{background:var(--surface2)}.menu-arrow{font-size:13px;color:var(--muted)}.menu-children{padding:2px 0 3px}.menu-child{min-height:33px;margin:1px 0;padding:0 8px 0 21px;font-size:13px;font-weight:400;color:color-mix(in srgb,CanvasText 82%,transparent)}.menu-child:hover{background:var(--surface2)}.menu-child.active{background:color-mix(in srgb,Highlight 15%,Canvas);color:CanvasText;font-weight:650}.menu-item.active{background:color-mix(in srgb,Highlight 15%,Canvas)}.menu-collapse-all{margin-top:13px;justify-content:center;border:1px solid var(--border);font-size:12px;color:var(--muted)}
#main{min-width:0;flex:1}#admin-header{height:58px;display:flex;justify-content:flex-end;align-items:center;padding:0 clamp(16px,3vw,42px);border-bottom:1px solid var(--border);background:Canvas;position:sticky;top:0;z-index:10}.admin-user-menu{position:relative}.admin-user-menu summary{list-style:none;cursor:pointer;padding:7px 9px;border-radius:7px;font-size:14px;font-weight:600}.admin-user-menu summary::-webkit-details-marker{display:none}.admin-user-menu summary::after{content:'▾';margin-left:7px;color:var(--muted)}.admin-user-menu[open] summary{background:var(--surface2)}.admin-user-dropdown{position:absolute;right:0;top:calc(100% + 6px);min-width:160px;padding:7px;border:1px solid var(--border);border-radius:9px;background:Canvas;box-shadow:0 10px 30px color-mix(in srgb,CanvasText 12%,transparent)}.admin-user-name{padding:7px 9px 9px;color:var(--muted);font-size:13px;border-bottom:1px solid var(--border);margin-bottom:5px}.admin-logout-button{width:100%;text-align:left;border:0;background:transparent}
#content{min-width:0;padding:26px clamp(16px,3vw,42px) 42px}.admin-page{max-width:1280px;margin:0 auto}.admin-page-header{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:20px}.admin-page-header h1{margin:0;font-size:25px;line-height:1.2}.admin-page-header p{margin:7px 0 0;color:var(--muted)}.panel,.admin-section{border:1px solid var(--border);border-radius:9px;background:Canvas;padding:15px;margin-bottom:13px}.panel h3,.admin-section h1,.admin-section h2{margin-top:0}.toolbar,.actions{display:flex;gap:7px;flex-wrap:wrap;align-items:center}.pagination{display:flex;justify-content:center;gap:9px;align-items:center;margin-top:14px}.meta,.admin-muted{color:var(--muted)}.admin-loading,.admin-empty{padding:24px;text-align:center;color:var(--muted);border:1px dashed var(--border);border-radius:8px}.admin-error{padding:13px;border:1px solid color-mix(in srgb,#b42318 45%,transparent);border-radius:8px;color:#b42318;background:color-mix(in srgb,#b42318 7%,Canvas)}.admin-table{width:100%;border-collapse:collapse;font-size:13px}.admin-table th,.admin-table td{padding:9px 10px;border-bottom:1px solid var(--border);text-align:left;vertical-align:middle}.admin-table th{background:var(--surface);font-weight:650;white-space:nowrap}.admin-table tr:last-child td{border-bottom:0}.admin-detail-table{font-size:13px}.admin-detail-table th:first-child{width:150px}.badge{display:inline-block;margin:3px 5px 3px 0;padding:3px 8px;border:1px solid var(--border);border-radius:999px;font-size:12px}.category-row{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}.danger{border-color:color-mix(in srgb,#b42318 55%,var(--border))}.account-detail-row{padding:12px 0;border-bottom:1px solid var(--border)}.account-detail-row:last-child{border-bottom:0}.account-detail-row>.admin-detail-table{margin-bottom:8px}.detail-box{margin-top:9px}.account-info-error{color:#b42318}.admin-login-page{min-height:100vh;display:grid;place-items:center;padding:24px}.admin-login-card{width:min(420px,100%);padding:30px;border:1px solid var(--border);border-radius:14px;background:Canvas;box-shadow:0 12px 40px color-mix(in srgb,CanvasText 10%,transparent)}.admin-login-brand{font-size:14px;font-weight:700;color:var(--muted);margin-bottom:18px}.admin-login-card h1{margin:0;font-size:25px}.admin-login-card p{margin:8px 0 21px}.admin-login-form{display:grid;gap:13px}.admin-login-form label{display:grid;gap:6px;font-size:14px;font-weight:600}.admin-login-form button{margin-top:4px;width:100%;font-weight:650}.admin-login-error{min-height:20px;color:#b42318;font-size:13px}
@media(max-width:760px){:root{--sidebar:150px}#menu{padding:12px 7px}#content{padding:20px 12px 30px}.admin-page-header{flex-direction:column}.admin-table{display:block;overflow-x:auto;white-space:nowrap}}
</style></head>
<body><div id="layout"><nav id="menu" aria-label="管理后台导航"></nav><main id="main"><header id="admin-header" hidden></header><div id="content"></div></main></div><script type="module" src="/admin/app.js"></script></body></html>
