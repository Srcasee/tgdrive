<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TGDrive Admin</title>
<style>
:root {
  color-scheme: light dark;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --sidebar-width: 248px;
  --border: color-mix(in srgb, CanvasText 16%, transparent);
  --muted: color-mix(in srgb, CanvasText 62%, transparent);
  --surface: color-mix(in srgb, Canvas 96%, CanvasText 4%);
  --surface-strong: color-mix(in srgb, Canvas 92%, CanvasText 8%);
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { margin: 0; background: Canvas; color: CanvasText; }
button, input, select { font: inherit; }
button { min-height: 36px; padding: 0 12px; border: 1px solid var(--border); border-radius: 8px; background: ButtonFace; color: ButtonText; cursor: pointer; }
button:hover:not(:disabled) { filter: brightness(.97); }
button:disabled { cursor: not-allowed; opacity: .55; }
input, select { min-height: 36px; padding: 0 10px; border: 1px solid var(--border); border-radius: 8px; background: Canvas; color: CanvasText; }
#layout { display: flex; min-height: 100vh; }
#menu { width: var(--sidebar-width); flex: 0 0 var(--sidebar-width); padding: 20px 14px; border-right: 1px solid var(--border); background: var(--surface); position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.menu-brand { padding: 4px 12px 20px; border-bottom: 1px solid var(--border); margin-bottom: 14px; }
.menu-brand strong { display: block; font-size: 18px; }
.menu-brand small { display: block; margin-top: 4px; color: var(--muted); }
.menu-group { margin: 16px 0 6px; }
.menu-section { padding: 7px 12px; color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: .04em; }
.menu-child, .menu-item { display: flex; align-items: center; min-height: 38px; margin: 2px 0; padding: 0 12px; border-radius: 8px; cursor: pointer; user-select: none; }
.menu-child { margin-left: 8px; color: color-mix(in srgb, CanvasText 86%, transparent); }
.menu-child:hover, .menu-item:hover { background: var(--surface-strong); }
.menu-child.active, .menu-item.active { background: color-mix(in srgb, Highlight 16%, Canvas); color: HighlightText; font-weight: 650; }
#content { min-width: 0; flex: 1; padding: 32px clamp(20px, 4vw, 48px) 48px; }
.admin-page { max-width: 1200px; margin: 0 auto; }
.admin-page-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; margin-bottom: 24px; }
.admin-page-header h1 { margin: 0; font-size: 28px; line-height: 1.2; }
.admin-page-header p { margin: 8px 0 0; color: var(--muted); }
.panel, .admin-section { border: 1px solid var(--border); border-radius: 12px; background: Canvas; padding: 18px; margin-bottom: 16px; }
.panel h3, .admin-section h1, .admin-section h2 { margin-top: 0; }
.toolbar, .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.pagination { display: flex; justify-content: center; gap: 10px; align-items: center; margin-top: 18px; }
.meta, .admin-muted { color: var(--muted); }
.admin-loading, .admin-empty { padding: 28px; text-align: center; color: var(--muted); border: 1px dashed var(--border); border-radius: 10px; }
.admin-error { padding: 14px; border: 1px solid color-mix(in srgb, #b42318 45%, transparent); border-radius: 10px; color: #b42318; background: color-mix(in srgb, #b42318 7%, Canvas); }
.admin-table { width: 100%; border-collapse: collapse; }
.admin-table th, .admin-table td { padding: 11px 12px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
.admin-table th { background: var(--surface); font-weight: 650; }
.admin-table tr:last-child td { border-bottom: 0; }
.badge { display: inline-block; margin: 3px 5px 3px 0; padding: 3px 8px; border: 1px solid var(--border); border-radius: 999px; font-size: 12px; }
.category-row { display: flex; gap: 8px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
.danger { border-color: color-mix(in srgb, #b42318 55%, var(--border)); }
@media (max-width: 760px) {
  :root { --sidebar-width: 190px; }
  #menu { padding: 14px 8px; }
  .menu-brand { padding-left: 8px; }
  .menu-child, .menu-item { padding: 0 8px; }
  #content { padding: 20px 14px 32px; }
  .admin-page-header { flex-direction: column; }
  .admin-table { display: block; overflow-x: auto; white-space: nowrap; }
}
</style>
</head>
<body>
<div id="layout">
<nav id="menu" aria-label="管理后台导航"></nav>
<main id="content"></main>
</div>
<script type="module" src="/admin/app.js"></script>
</body>
</html>
