services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tgdrive
      POSTGRES_USER: tgdrive
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tgdrive -d tgdrive"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - telegram-net

  tgdrive:
    image: ghcr.io/srcasee/tgdrive:latest
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./data:/data
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8000"
    networks:
      - telegram-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  telegram-login:
    image: ghcr.io/srcasee/tgdrive:latest
    working_dir: /app
    volumes:
      - ./data:/data
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
    cpus: ${TG_LOGIN_CPUS:-1.0}
    mem_limit: ${TG_LOGIN_MEMORY:-512m}
    networks:
      - telegram-net
    profiles:
      - login

  proxy:
    image: ${TGDRIVE_PROXY_IMAGE:-ghcr.io/srcasee/tgdrive-proxy:latest}
    pull_policy: always
    restart: unless-stopped
    profiles:
      - proxy
    env_file:
      - .env
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,socket; s=socket.create_connection(('127.0.0.1', int(os.getenv('TG_PROXY_PORT', '1080'))), timeout=2); s.close()"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
      telegram-net:
        aliases:
          - proxy

networks:
  telegram-net:
    driver: bridge
