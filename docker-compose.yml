services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tgdrive
      POSTGRES_USER: tgdrive
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tgdrive}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tgdrive -d tgdrive"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - telegram-net

  telegram-drive:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./data:/data
      - ./plugins:/opt/tgdrive-plugins:ro
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://tgdrive:tgdrive@postgres:5432/tgdrive}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8000"
    networks:
      - telegram-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  proxy:
    build:
      context: ./plugins/proxy
      dockerfile: Dockerfile
    restart: unless-stopped
    profiles:
      - proxy
    env_file:
      - .env
    networks:
      telegram-net:
        aliases:
          - proxy

networks:
  telegram-net:
    driver: bridge
