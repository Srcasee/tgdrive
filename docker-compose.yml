services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tgdrive
      POSTGRES_USER: tgdrive
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tgdrive -d tgdrive"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - telegram-net

  tgdrive:
    image: tgdrive:laster
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./data:/data
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    ports:
      - "8080:8000"
    networks:
      - telegram-net
      - proxy-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  telegram-login:
    image: tgdrive:laster
    working_dir: /app
    volumes:
      - ./data:/data
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
    networks:
      - telegram-net
    profiles:
      - login

  proxy:
    image: ghcr.nju.edu.cn/sagernet/sing-box:v1.14.2
    pull_policy: missing
    restart: unless-stopped
    profiles:
      - proxy
    volumes:
      - ./config.json:/etc/sing-box/config.json:ro
    command:
      - run
      - -c
      - /etc/sing-box/config.json
    networks:
      - proxy-net

networks:
  telegram-net:
    driver: bridge
  proxy-net:
    driver: bridge
