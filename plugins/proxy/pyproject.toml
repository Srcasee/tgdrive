[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tgdrive-proxy"
version = "0.3.0"
description = "Optional network proxy capability plugin for tgdrive"
requires-python = ">=3.11"
dependencies = ["PySocks>=1.7,<2"]

[project.entry-points."tgdrive.plugins"]
proxy = "tgdrive_proxy:ProxyPlugin"

[tool.setuptools]
py-modules = ["tgdrive_proxy"]
