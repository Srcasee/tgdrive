name: PostgreSQL integration

on:
  push:
    branches: [main]
  pull_request:

jobs:
  postgres:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tgdrive_test
          POSTGRES_USER: tgdrive
          POSTGRES_PASSWORD: tgdrive
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tgdrive -d tgdrive_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://tgdrive:tgdrive@localhost:5432/tgdrive_test
      PYTHONPATH: app:.
      AUTH_SECRET: ci-test-secret
      AUTH_COOKIE_SECURE: "false"
      AUTH_TOKEN_TTL: "3600"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run full test suite
        run: pytest -q
      - name: Build proxy plugin image
        run: docker build --build-arg SING_BOX_VERSION=1.13.19 -t tgdrive-proxy-ci ./plugins/proxy
