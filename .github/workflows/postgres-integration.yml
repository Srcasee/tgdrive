name: PostgreSQL integration

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches-ignore: [main]

jobs:
  postgres:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tgdrive_test
          POSTGRES_USER: tgdrive
          POSTGRES_PASSWORD: tgdrive
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tgdrive -d tgdrive_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://tgdrive:tgdrive@localhost:5432/tgdrive_test
      PYTHONPATH: app:.
      AUTH_SECRET: ci-test-secret
      AUTH_COOKIE_SECURE: "false"
      AUTH_TOKEN_TTL: "3600"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run full test suite
        run: pytest -q
      - name: Validate deployment scripts and Compose model
        run: |
          sh -n deploy.sh
          sh -n login-account.sh
          cp .env.example .env.ci
          cp .env.ci .env
          POSTGRES_PASSWORD=ci-test-password \
          DATABASE_URL=postgresql://tgdrive:ci-test-password@postgres:5432/tgdrive_test \
            docker compose --env-file .env.ci config >/dev/null
          rm -f .env
      - name: Build Core image
        run: docker build -t tgdrive-core-ci .
